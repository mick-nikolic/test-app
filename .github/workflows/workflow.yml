name: App Workflow

on:
  push:
    branches: [ "main" , "dev", "stage"]
  pull_request:
    branches: [ "main" , "dev", "stage" ]

permissions:
  contents: read 

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Set up Python 
      uses: actions/setup-python@v7 
      with:
        python-version: '3.14'

    - name: Install Conad Env.
      run: make install
    
    - name: Code formaters
      run: make check